<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>내 전용 캠핑 지도</title>
    <!-- 사파리 '홈 화면에 추가' 시 사용할 아이콘 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- 네이버지도 SDK -->
    <script async onload="window.cmMapReady?.()" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=yjuis1thok&submodules=geocoder"></script>
<meta name="theme-color" content="#1f7a3d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/camp.css?v=20261118e">
</head>
<body>

<div id="sidebar">
    <button class="sidebar-btn active" id="sidebar-btn-map" onclick="switchView('map')">
        <span class="sidebar-icon">🗺️</span><span>지도</span>
    </button>
    <button class="sidebar-btn" id="sidebar-btn-food" onclick="switchView('food')">
        <span class="sidebar-icon">🍳</span><span>음식</span>
    </button>
    <button class="sidebar-btn" id="sidebar-btn-records" onclick="switchView('records')">
        <span class="sidebar-icon">📅</span><span>기록</span>
    </button>
    <button class="sidebar-btn" id="sidebar-btn-gear" onclick="switchView('gear')">
        <span class="sidebar-icon">🎒</span><span>장비</span>
    </button>
    <button class="sidebar-btn" id="sidebar-btn-fuel" onclick="toggleFuelLayer()">
        <span class="sidebar-icon">⛽</span><span>등유</span>
    </button>
</div>

<div class="search-wrapper">
    <div class="search-container">
        <button class="glamping-toggle" id="glamping-toggle" type="button" aria-pressed="false" title="글램핑 전용 시설 제외 중" onclick="toggleGlamping()">글램핑</button>
        <input type="text" id="search-keyword" class="search-input" placeholder="캠핑장 이름 검색 (예: 계방산)" onkeyup="if(event.keyCode===13) searchCamping();">
        <button class="search-btn" id="search-btn" onclick="searchCamping()">검색</button>
    </div>
    <ul id="search-results"></ul>
</div>

<div id="status-badge"></div>

<button id="map-fuel-toggle" type="button" onclick="toggleFuelLayer()" aria-pressed="false" aria-label="지도에서 등유 가격 조회">⛽ 등유 조회</button>
<ul id="fuel-price-list"></ul>

<div id="legend">
    <span><span class="dot" style="background:#249148;"></span>고캠핑 등록 캠핑장</span>
    <span><span class="dot" style="background:#e8590c;"></span>고캠핑 미등록 (보완 검색)</span>
    <span><span class="dot" style="background:#1c7ed6;"></span>⛽ 실내등유 판매 주유소</span>
    <span style="color:#868e96;"><span class="dot" style="background:transparent; border:1.5px solid #249148;"></span>초록 원 = 실제 검색 범위(최대 20km)</span>
    <span id="weather-legend-line" style="display:none; font-weight:600; padding-top:2px; border-top:1px solid #f1f3f5; margin-top:2px;"></span>
</div>

<div id="map"></div>

<button class="gps-btn" id="gps-btn" onclick="moveToCurrentLocation()">
    <svg class="gps-icon" viewBox="0 0 24 24">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
</button>

<div id="sheet-backdrop"></div>
<div id="bottom-sheet">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-header">
        <div>
            <div id="camp-category" class="camp-category"></div>
            <h3 id="camp-title" class="camp-title"></h3>
        </div>
        <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <p id="camp-address" class="camp-address"></p>
    <p id="camp-tel" class="camp-tel"></p>
    <div class="btn-row" id="reserve-btn-row"></div>
</div>

<!-- ---- 캠핑 음식 ---- -->
<div class="app-view" id="view-food">
    <div class="view-header">
        <h2>🍳 캠핑 음식</h2>
        <button class="view-close-btn" onclick="switchView('map')">✕</button>
    </div>
    <div class="view-body">
        <div id="food-no-trip-msg" style="display:none; color:#adb5bd; font-size:13px; padding:8px 0 16px; line-height:1.5;">
            먼저 '캠핑 기록'에서 예정 일정을 추가하면, 그 일정에 맞춰 음식을 계획할 수 있어요.
        </div>
        <select id="food-trip-select" class="add-input" style="margin-bottom:16px; display:none;" onchange="onFoodTripChange()"></select>

        <div id="food-trip-body">
            <div id="food-days-list"></div>
        </div>

        <div style="margin-top:28px; border-top:1px solid #e9ecef; padding-top:20px;">
            <h3 style="margin:0 0 10px; font-size:15px; color:#111;">⭐ 즐겨찾는 메뉴/밀키트</h3>
            <div style="font-size:12px; color:#888; margin-bottom:6px;">밀키트 내역</div>
            <div style="display:flex; gap:8px; margin-bottom:14px;">
                <select id="food-preset-history" class="add-input" style="flex:1;"></select>
                <button class="item-del-btn" onclick="deleteSelectedPreset()" title="선택한 밀키트 삭제" style="flex-shrink:0;">✕</button>
            </div>
            <div class="add-row">
                <input type="text" id="food-preset-input" class="add-input" placeholder="자주 먹는 메뉴/밀키트 저장 (예: 짜파구리 밀키트)" onkeyup="if(event.keyCode===13) addFoodPreset();">
                <button class="add-btn" onclick="addFoodPreset()">저장</button>
            </div>
        </div>

        <div id="food-restaurant-section" style="margin-top:28px; border-top:1px solid #e9ecef; padding-top:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0; font-size:15px; color:#111;">🍜 주변 맛집 추천</h3>
                <button class="add-btn" style="padding:8px 14px; font-size:13px;" onclick="findNearbyRestaurants()">추천받기</button>
            </div>
            <div id="restaurant-status" style="font-size:12px; color:#888; margin-bottom:8px;"></div>
            <div id="restaurant-list"></div>
        </div>
    </div>
</div>

<!-- ---- 캠핑 기록 ---- -->
<div class="app-view" id="view-records">
    <div class="view-header">
        <h2>📅 캠핑 기록</h2>
        <button class="view-close-btn" onclick="switchView('map')">✕</button>
    </div>
    <div class="view-body">
        <div class="tab-row">
            <button class="tab-btn active" id="records-tab-upcoming" onclick="switchRecordsTab('upcoming')">예정 일정</button>
            <button class="tab-btn" id="records-tab-history" onclick="switchRecordsTab('history')">지난 기록</button>
        </div>

        <div id="records-upcoming-panel">
            <div id="upcoming-list"></div>
            <div class="item-card record-form" style="align-items:stretch;">
                <div class="autocomplete-wrap" id="upcoming-title-autocomplete">
                    <input type="text" id="upcoming-title-input" class="add-input" placeholder="캠핑장/여행 이름 (입력하면 지도에서 검색돼요)" oninput="onUpcomingTitleInput()" autocomplete="off">
                    <ul class="autocomplete-list" id="upcoming-title-suggestions"></ul>
                </div>
                <div class="record-form-row">
                    <input type="text" id="upcoming-start-input" class="add-input date-input" placeholder="시작일" readonly onclick="openDatePicker(this)">
                    <input type="text" id="upcoming-end-input" class="add-input date-input" placeholder="종료일" readonly onclick="openDatePicker(this)">
                </div>
                <input type="url" id="upcoming-site-input" class="add-input" placeholder="사이트/예약 링크 (선택)">
                <textarea id="upcoming-note-input" class="add-input" placeholder="메모 (선택)" style="resize:vertical; min-height:50px;"></textarea>
                <button class="add-btn" onclick="addUpcomingRecord()">일정 추가</button>
            </div>
        </div>

        <div id="records-history-panel" style="display:none;">
            <div id="history-list"></div>
            <div class="item-card record-form" style="align-items:stretch;">
                <div class="autocomplete-wrap" id="history-camp-autocomplete">
                    <input type="text" id="history-camp-input" class="add-input" placeholder="캠핑장 이름 (입력하면 지도에서 검색돼요)" oninput="onHistoryCampInput()" autocomplete="off">
                    <ul class="autocomplete-list" id="history-camp-suggestions"></ul>
                </div>
                <div class="record-form-row">
                    <input type="text" id="history-start-input" class="add-input date-input" placeholder="시작일" readonly onclick="openDatePicker(this)">
                    <input type="text" id="history-end-input" class="add-input date-input" placeholder="종료일" readonly onclick="openDatePicker(this)">
                </div>
                <textarea id="history-note-input" class="add-input" placeholder="후기/메모" style="resize:vertical; min-height:50px;"></textarea>
                <button class="add-btn" onclick="addHistoryRecord()">기록 추가</button>
            </div>
        </div>
    </div>
</div>

<!-- ---- 내 장비 ---- -->
<div class="app-view" id="view-gear">
    <div class="view-header">
        <h2>🎒 내 장비</h2>
        <button class="view-close-btn" onclick="switchView('map')">✕</button>
    </div>
    <div class="view-body">
        <h3 style="font-size:15px; margin:0 0 10px;">장비 목록</h3>

        <div class="item-card" style="align-items:stretch; flex-direction:column; gap:8px;">
            <div class="record-form-row">
                <div class="autocomplete-wrap" style="flex:1;">
                    <input type="text" id="gear-category-input" class="add-input" placeholder="종류 (예: 텐트)" autocomplete="off">
                    <ul class="autocomplete-list" id="gear-category-suggestions"></ul>
                </div>
                <div class="autocomplete-wrap" style="flex:1;">
                    <input type="text" id="gear-manufacturer-input" class="add-input" placeholder="제조사 (예: 콜맨)" autocomplete="off">
                    <ul class="autocomplete-list" id="gear-manufacturer-suggestions"></ul>
                </div>
            </div>
            <input type="text" id="gear-name-input" class="add-input" placeholder="이름 (예: 라이트닝 볼트 4)">
            <input type="text" inputmode="numeric" id="gear-price-input" class="add-input" placeholder="금액 (원, 선택)">
            <button class="add-btn" onclick="addGearItem()">추가</button>
        </div>

        <div id="gear-master-list" style="margin-top:14px;"></div>

        <div style="margin-top:28px; border-top:1px solid #e9ecef; padding-top:20px;">
            <h3 style="font-size:15px; margin:0 0 10px;">캠핑 준비 체크리스트</h3>
            <div class="add-row">
                <input type="text" id="checklist-name-input" class="add-input" placeholder="체크리스트 이름 (예: 8월 계곡캠핑)">
                <button class="add-btn" onclick="createChecklist()">생성</button>
            </div>
            <select id="checklist-select" class="add-input" style="margin-top:10px;" onchange="renderChecklistDetail()">
                <option value="">체크리스트 선택...</option>
            </select>
            <div id="checklist-progress" style="font-size:12px; color:#1c7ed6; font-weight:600; margin:10px 0 4px;"></div>
            <div id="checklist-item-list"></div>
            <button class="reserve-btn secondary" style="margin-top:10px;" onclick="deleteCurrentChecklist()">이 체크리스트 삭제</button>
        </div>
    </div>
</div>

<script src="/app.js?v=20261118"></script>
<script type="module" src="/app-upgrade.js"></script>
</body>
</html>
